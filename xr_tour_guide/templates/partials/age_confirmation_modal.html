{% load i18n %}
<!-- Age Confirmation Modal - Non-blocking, informational -->
<div id="age-confirmation-modal" class="age-modal">
    <div class="age-modal-backdrop"></div>
    <div class="age-modal-content">
        <div class="age-modal-header">
            <div class="age-icon">🔞</div>
            <h3>{% trans "Age Verification" %}</h3>
            <p>{% trans "Please confirm if you are 18 years or older to access all functionalities of the application." %}</p>
        </div>
        
        <div class="age-modal-body">
            <label class="age-checkbox-container">
                <input type="checkbox" id="age-confirm-checkbox" class="age-checkbox">
                <span class="age-checkbox-label">
                    {% trans "I am 18 years of age or older" %}
                </span>
            </label>
        </div>
        
        <div class="age-modal-footer">
            <button type="button" id="age-modal-continue" class="age-btn age-btn-primary">
                {% trans "Continue" %}
            </button>
        </div>
    </div>
</div>

<style>
.age-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    align-items: center;
    justify-content: center;
}

.age-modal.show {
    display: flex !important;
}

.age-modal-backdrop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
}

.age-modal-content {
    position: relative;
    z-index: 10001;
    background: white;
    border-radius: 16px;
    padding: 45px;
    max-width: 480px;
    width: 90%;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    animation: modalSlideIn 0.4s ease-out;
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.age-modal-header {
    text-align: center;
    margin-bottom: 30px;
}

.age-icon {
    font-size: 4rem;
    margin-bottom: 20px;
}

.age-modal-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: #1a202c;
    margin-bottom: 12px;
    font-weight: 700;
}

.age-modal-header p {
    color: #4a5568;
    font-size: 1rem;
    line-height: 1.6;
    margin: 0;
}

.age-modal-body {
    background: #f7fafc;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 30px;
    border: 2px solid #e2e8f0;
}

.age-checkbox-container {
    display: flex;
    align-items: flex-start;
    cursor: pointer;
    user-select: none;
}

.age-checkbox {
    margin-top: 4px;
    margin-right: 14px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    accent-color: #2d3748;
}

.age-checkbox-label {
    color: #2d3748;
    font-size: 1rem;
    line-height: 1.6;
    font-weight: 600;
}

.age-modal-footer {
    display: flex;
    gap: 14px;
}

.age-btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 16px 24px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.3s ease;
}

.age-btn-primary {
    background: #2d3748;
    color: white;
    box-shadow: 0 4px 14px rgba(45, 55, 72, 0.25);
}

.age-btn-primary:hover {
    background: #1a202c;
    transform: translateY(-2px);
}

@media (max-width: 480px) {
    .age-modal-content {
        padding: 35px 25px;
    }
}
</style>

<script>
const AgeConfirmationModal = (function() {
    let modal = null;
    let checkbox = null;
    let continueBtn = null;
    let resolveCallback = null;

    function init() {
        modal = document.getElementById('age-confirmation-modal');
        if (!modal) return;

        checkbox = document.getElementById('age-confirm-checkbox');
        continueBtn = document.getElementById('age-modal-continue');
        
        const backdrop = modal.querySelector('.age-modal-backdrop');

        continueBtn.addEventListener('click', function() {
            hide();
        });

        backdrop.addEventListener('click', function() {
            hide();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.classList.contains('show')) {
                hide();
            }
        });
    }

    function show() {
        return new Promise((resolve) => {
            resolveCallback = resolve;
            checkbox.checked = false; // Reset
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        });
    }

    function hide() {
        const isChecked = checkbox.checked;
        modal.classList.remove('show');
        document.body.style.overflow = '';
        
        if (resolveCallback) {
            resolveCallback(isChecked); // Restituisce true o false
            resolveCallback = null;
        }
    }

    return { init: init, show: show };
})();

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', AgeConfirmationModal.init);
} else {
    AgeConfirmationModal.init();
}
</script>
