{% load i18n %}
<!-- Age Confirmation Modal -->
<div id="age-confirmation-modal" class="age-modal">
    <div class="age-modal-backdrop"></div>
    <div class="age-modal-content">
        <div class="age-modal-header">
            <div class="age-icon">🔞</div>
            <h3>{% trans "Age Verification Required" %}</h3>
            <p>{% trans "You must be 18 years of age or older to register." %}</p>
        </div>
        
        <div class="age-modal-body">
            <label class="age-checkbox-container">
                <input type="checkbox" id="age-confirm-checkbox" class="age-checkbox">
                <span class="age-checkbox-label">
                    {% trans "I confirm that I am 18 years of age or older" %}
                </span>
            </label>
        </div>
        
        <div class="age-modal-footer">
            <button type="button" id="age-modal-cancel" class="age-btn age-btn-cancel">
                {% trans "Cancel" %}
            </button>
            <button type="button" id="age-modal-confirm" class="age-btn age-btn-primary" disabled>
                {% trans "Confirm & Continue" %}
            </button>
        </div>
    </div>
</div>

<style>
.age-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10000;
    align-items: center;
    justify-content: center;
}

.age-modal.show {
    display: flex !important;
}

.age-modal-backdrop {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    animation: fadeIn 0.3s ease-out;
}

.age-modal-content {
    position: relative;
    z-index: 10001;
    background: white;
    border-radius: 16px;
    padding: 45px;
    max-width: 480px;
    width: 90%;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    animation: modalSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes modalSlideIn {
    from {
        opacity: 0;
        transform: translateY(-40px) scale(0.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.age-modal-header {
    text-align: center;
    margin-bottom: 30px;
}

.age-icon {
    font-size: 4rem;
    margin-bottom: 20px;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.8; }
}

.age-modal-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    color: #1a202c;
    margin-bottom: 12px;
    font-weight: 700;
}

.age-modal-header p {
    color: #4a5568;
    font-size: 1rem;
    line-height: 1.6;
    margin: 0;
}

.age-modal-body {
    background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 30px;
    border: 2px solid #e2e8f0;
}

.age-checkbox-container {
    display: flex;
    align-items: flex-start;
    cursor: pointer;
    user-select: none;
}

.age-checkbox {
    margin-top: 4px;
    margin-right: 14px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    flex-shrink: 0;
    accent-color: #2d3748;
}

.age-checkbox-label {
    color: #2d3748;
    font-size: 1rem;
    line-height: 1.6;
    font-weight: 600;
}

.age-modal-footer {
    display: flex;
    gap: 14px;
}

.age-btn {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 16px 24px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'DM Sans', sans-serif;
}

.age-btn-cancel {
    background: #e2e8f0;
    color: #2d3748;
}

.age-btn-cancel:hover {
    background: #cbd5e0;
}

.age-btn-primary {
    background: #2d3748;
    color: white;
    box-shadow: 0 4px 14px rgba(45, 55, 72, 0.25);
}

.age-btn-primary:not(:disabled):hover {
    background: #1a202c;
}

.age-btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

@media (max-width: 480px) {
    .age-modal-content {
        padding: 35px 25px;
    }
    .age-modal-footer {
        flex-direction: column;
    }
}
</style>

<script>
const AgeConfirmationModal = (function() {
    let modal = null;
    let checkbox = null;
    let confirmBtn = null;
    let resolveCallback = null;

    function init() {
        modal = document.getElementById('age-confirmation-modal');
        if (!modal) return;

        checkbox = document.getElementById('age-confirm-checkbox');
        confirmBtn = document.getElementById('age-modal-confirm');
        
        const cancelBtn = document.getElementById('age-modal-cancel');
        const backdrop = modal.querySelector('.age-modal-backdrop');

        checkbox.addEventListener('change', function() {
            confirmBtn.disabled = !this.checked;
        });

        confirmBtn.addEventListener('click', function() {
            if (checkbox.checked) hide(true);
        });

        cancelBtn.addEventListener('click', function() {
            hide(false);
        });

        backdrop.addEventListener('click', function() {
            hide(false);
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.classList.contains('show')) {
                hide(false);
            }
        });
    }

    function show() {
        return new Promise((resolve) => {
            resolveCallback = resolve;
            checkbox.checked = false;
            confirmBtn.disabled = true;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        });
    }

    function hide(confirmed) {
        modal.classList.remove('show');
        document.body.style.overflow = '';
        if (resolveCallback) resolveCallback(confirmed);
        resolveCallback = null;
    }

    return { init: init, show: show };
})();

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', AgeConfirmationModal.init);
} else {
    AgeConfirmationModal.init();
}
</script>
